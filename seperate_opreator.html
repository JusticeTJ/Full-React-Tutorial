<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPREAD OPERATOR</title>
</head>
<body>
    <!--====SPREAD OPERATOR===--->
<!--The JavaScript spread operator (...) copies all or part of an existing array or object into another array or object. -->
<script>
const numbersOne = [1, 2, 3];
const numbersTwo = [4, 5, 6];
const numbersCombined = [...numbersOne, ...numbersTwo];

document.write(numbersCombined);
</script>

<!-- Example
Assign the first and second items from numbers to variables and put the rest in an array: -->
<script>
const numbers = [1, 2, 3, 4, 5, 6];

const [one, two, ...rest] = numbers;

document.write("<p>" + one + "</p>");
document.write("<p>" + two + "</p>");
document.write("<p>" + rest + "</p>");
</script>

<!-- We can use the spread operator with objects too:

Example
Combine these two objects: -->
<script>
const myVehicle = {
  brand: 'Ford',
  model: 'Mustang',
  color: 'red'
}

const updateMyVehicle = {
  type: 'car',
  year: 2021, 
  color: 'yellow'
}

const myUpdatedVehicle = {...myVehicle, ...updateMyVehicle}

//Check the result object in the console:
console.log(myUpdatedVehicle);
</script>
<!-- Notice that the properties that did not match were added, and the property that did match was overwritten by the last object. -->
</body>
</body>
</html>
