<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>classes</title>
</head>
<body>
    <!-- Classes
ES6 introduced classes.
A class is a type of function, but instead of using the keyword function to initiate it, we use the keyword class, and the properties are assigned inside a constructor() method. -->

<script>
class Car {
  constructor(name) {
    this.brand = name;
  }
}

const mycar = new Car("Ford");

document.write(mycar.brand);
</script><br>
<!-- Notice the case of the class name. We have begun the name, "Car", with an uppercase character.
  This is a standard naming convention for classes. -->
  <script>
  class Bike {
  constructor(name) {
    this.brand = name;
  }
  
  present() {
    return 'I have a ' + this.brand;
  }
}

const mybike = new Bike("Ninja Kawasaki H2");
document.write(mybike.present());
</script><br>
<!-- As you can see in the example above, you call the method by referring to the object's method name followed by parentheses (parameters would go inside the parentheses). -->

<!-- Class Inheritance
To create a class inheritance, use the *extends* keyword.

A class created with a class inheritance inherits all the methods from another class: -->

<!-- Example
Create a class named "Model" which will inherit the methods from the "Ride" class: -->
<script>
class Ride {
  constructor(name) {
    this.brand = name;
  }

  present() {
    return 'I have a ' + this.brand;
  }
}

class Model extends Ride {
  constructor(name, mod) {
    super(name);
    this.model = mod;
  }  
  show() {
    return this.present() + ', it is a ' + this.model
  }
}

const myride = new Model("Nissian", "Pathfinder");
document.write(myride.show());
</script><br>
<!-- The super() method refers to the parent class.
By calling the super() method in the constructor method,
 we call the parent's constructor method and get access to the parent's properties and methods. -->
</body>
</html>
