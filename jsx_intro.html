<!-- What is JSX? -->
<!-- JSX stands for JavaScript XML.
 JSX is an extension of JavaScript. It is a syntax that allows you to write HTML-like code within JavaScript. JSX is used in React to describe the structure and appearance of the user interface. -->
<!-- JSX allows us to write HTML in React. -->
<!-- JSX makes it easier to write and add HTML in React. -->

<!-- Coding JSX -->
<!-- JSX allows us to write HTML elements in JavaScript and place them in the DOM without any createElement()  and/or appendChild() methods. -->
<!-- JSX converts HTML tags into react elements. -->
<!-- You are not required to use JSX, but JSX makes it easier to write React applications. -->
<!-- Here are two examples. The first uses JSX and the second does not: -->

<!-- Example 1: Using JSX

 const myElement = <h1>I Love JSX!</h1>;
createRoot(document.getElementById('root')).render(
  myElement
); -->

<!-- Example 2
Without JSX: -->

<!-- const myElement = React.createElement('h1', {}, 'I do not use JSX!');
createRoot(document.getElementById('root')).render(
  myElement
); -->

<!-- As you can see in the first example, JSX allows us to write HTML directly within the JavaScript code.

JSX is an extension of the JavaScript language based on ES6, and is translated into regular JavaScript at runtime.-->

The expression can be a React variable, or property, or any other valid JavaScript expression. JSX will execute the expression and return the result: -->

<!-- Elements Must be Closed
JSX follows XML rules, and therefore HTML elements must be properly closed.

Example
Close empty elements with />

main.jsx
const myElement = <input type="text" />;

JSX will throw an error if the HTML is not properly closed. -->

<!-- Attribute class = className
The class attribute is a much used attribute in HTML, but since JSX is rendered as JavaScript, and the class keyword is a reserved word in JavaScript, you are not allowed to use it in JSX.

Use attribute className instead.

JSX solved this by using className instead. When JSX is rendered, it translates className attributes into class attributes.

Example
Use attribute className instead of class in JSX:

main.jsx
const myElement = <h1 className="myclass">Hello World</h1>; -->

<!-- Comments in JSX
Comments in JSX are written with {/* */}

Example
Comments in JSX:

main.jsx
const myElement = <h1>Hello {/* Wonderful */} World </h1>; -->

React components are like JavaScript functions, and return HTML.
JSX works perfect inside React components.
